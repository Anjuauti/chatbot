<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<style>
  :root {
    --bg: #e9eef5;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5d6b82;
    --line: #d6deea;
    --bot: #e6edf7;
    --accent: #2f6bff;
    --danger: #b3261e;
    --font: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); display: flex; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .sidebar { width: 280px; background: var(--ink); color: #fff; display: flex; flex-direction: column; padding: 20px 16px; gap: 16px; }
  .sidebar h1 { font-size: 1.25rem; margin: 4px 8px 0; letter-spacing: -0.01em; }
  .new-chat { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 11px 14px; font-weight: 600; cursor: pointer; }
  .new-chat:hover { background: #4a7fff; }
  .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .list button { text-align: left; background: transparent; border: 0; color: #c9d4e8; padding: 10px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list button:hover { background: rgba(255,255,255,.08); }
  .list button[aria-current="true"] { background: rgba(255,255,255,.16); color: #fff; font-weight: 600; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 20px; }
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--panel); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; max-width: 820px; width: 100%; margin: 0 auto; }
  .chat-head { padding: 16px 22px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 32ch; line-height: 1.5; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg time { display: block; font-size: .72rem; opacity: .65; margin-top: 4px; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; background: #fdecea; color: var(--danger); font-size: .9rem; }
  .typing { align-self: flex-start; color: var(--muted); font-size: .9rem; }

  form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); }
  input[type="text"] { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #f7f9fc; }
  form button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 22px; font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px; gap: 10px; }
    .sidebar h1 { display: none; }
    .list { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .list button { max-width: 160px; }
    .new-chat { white-space: nowrap; }
    main { padding: 10px; min-height: 0; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>Chatbot</h1>
    <button class="new-chat" id="newChat" type="button">New conversation</button>
    <nav class="list" id="list" aria-label="Conversations"></nav>
  </aside>

  <main>
    <section class="chat">
      <div class="chat-head" id="title">New conversation</div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form id="form" autocomplete="off">
        <input type="text" id="input" placeholder="Type a message" maxlength="1000" aria-label="Message">
        <button type="submit" id="send">Send</button>
      </form>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const listEl = $("list"), msgsEl = $("messages"), titleEl = $("title");
  const input = $("input"), sendBtn = $("send");
  let currentId = null;

  async function api(path, options = {}) {
    const res = await fetch(path, {
      headers: { "Content-Type": "application/json" }, ...options,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    return data;
  }

  const clock = (iso) => new Date(iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z")
    .toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function addMessage(role, text, time) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    if (time) {
      const t = document.createElement("time");
      t.textContent = clock(time);
      el.appendChild(t);
    }
    msgsEl.appendChild(el);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return el;
  }

  function showEmpty() {
    msgsEl.innerHTML = "";
    const el = document.createElement("div");
    el.className = "empty";
    el.textContent = "This conversation is empty. Say hello or ask “What is Python?” to begin.";
    msgsEl.appendChild(el);
  }

  async function loadList() {
    const conversations = await api("/api/conversations");
    listEl.innerHTML = "";
    for (const c of conversations) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = c.title;
      b.title = c.title;
      if (c.id === currentId) b.setAttribute("aria-current", "true");
      b.onclick = () => openConversation(c.id);
      listEl.appendChild(b);
    }
    return conversations;
  }

  async function openConversation(id) {
    const c = await api("/api/conversations/" + id);
    currentId = c.id;
    titleEl.textContent = c.title;
    msgsEl.innerHTML = "";
    if (c.messages.length === 0) showEmpty();
    c.messages.forEach((m) => addMessage(m.role, m.content, m.created_at));
    await loadList();
    input.focus();
  }

  async function startConversation() {
    const c = await api("/api/conversations", { method: "POST" });
    await openConversation(c.id);
  }

  $("newChat").onclick = () => startConversation().catch((e) => addMessage("error", e.message));

  $("form").onsubmit = async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || currentId === null) return;
    input.value = "";
    sendBtn.disabled = true;
    msgsEl.querySelector(".empty")?.remove();
    const pending = addMessage("user", text);
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.textContent = "Bot is typing…";
    msgsEl.appendChild(typing);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    try {
      const data = await api(`/api/conversations/${currentId}/messages`, {
        method: "POST", body: JSON.stringify({ message: text }),
      });
      typing.remove();
      pending.remove();
      addMessage("user", data.user_message.content, data.user_message.created_at);
      addMessage("bot", data.bot_message.content, data.bot_message.created_at);
      titleEl.textContent = data.conversation.title;
      loadList();
    } catch (err) {
      typing.remove();
      addMessage("error", err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  };

  (async () => {
    try {
      const existing = await loadList();
      if (existing.length) await openConversation(existing[0].id);
      else await startConversation();
    } catch (e) { addMessage("error", e.message); }
  })();
</script>
</body>
</html>
